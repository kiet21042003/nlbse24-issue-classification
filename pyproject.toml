[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlbse24-issue-classification"
version = "0.1.0"
description = "Reproducible NLBSE'24 issue report classification experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib==1.5.2",
  "numpy==1.26.4",
  "pandas==2.2.0",
  "psutil==7.1.2",
  "scikit-learn==1.7.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.1",
  "pytest-cov==7.0.0",
  "ruff==0.12.12",
]

[project.scripts]
nlbse24 = "nlbse24.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
