# Contrastive pair-generation ablation: num_iterations=5 (paper HP search
# lower bound), full training data, everything else identical to the official
# baseline reproduction.
[experiment]
seed = 42
n_splits = 5
text_fields = ["title", "body"]

[model]
backbone = "sentence-transformers/all-mpnet-base-v2"
max_seq_length = 128
device = "cuda"

[sampling]
num_iterations = 5
num_epochs = 1
batch_size = 16
head_batch_size = 2
