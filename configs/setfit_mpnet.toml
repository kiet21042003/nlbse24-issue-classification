# Reproduction of the official NLBSE'24 SetFit baseline
# (nlbse2024/issue-report-classification, 2-Template-SetFit.ipynb,
# cross-repository F1 = 0.8270): all-mpnet-base-v2, full 300 training rows
# per repository, num_iterations=20, num_epochs=1, batch_size=(16, 2),
# seed 42. Documented deviations: team text contract "{title}\n\n{body}"
# (template uses a single space) and max_seq_length=128 tail truncation
# required by the data audit outlier.
[experiment]
seed = 42
n_splits = 5
text_fields = ["title", "body"]

[model]
backbone = "sentence-transformers/all-mpnet-base-v2"
max_seq_length = 128
device = "cuda"

[sampling]
num_iterations = 20
num_epochs = 1
batch_size = 16
head_batch_size = 2
