# P2 frozen configuration: supervised fastText.
# Requires the optional backend: pip install -r requirements-fasttext.txt
model_family = "fasttext"

[experiment]
seed = 42
n_splits = 5
text_fields = ["title", "body"]

[model]
dim = 100
lr = 0.5
epoch = 25
word_ngrams = 2
min_count = 1
minn = 3
maxn = 6
bucket = 200000
loss = "softmax"
