# MiniLM variant of the SetFit baseline: same recipe as setfit_mpnet.toml
# (num_iterations=20, num_epochs=1, batch_size=(16, 2), seed 42, full
# training rows) but cheaper backbone sentence-transformers/all-MiniLM-L6-v2.
# Documented deviations are identical: team text contract "{title}\n\n{body}"
# (template uses a single space) and max_seq_length=128 tail truncation.
[experiment]
seed = 42
n_splits = 5
text_fields = ["title", "body"]

[model]
backbone = "sentence-transformers/all-MiniLM-L6-v2"
max_seq_length = 128
# device = "cuda"

[sampling]
num_iterations = 20
num_epochs = 1
batch_size = 16
head_batch_size = 2
