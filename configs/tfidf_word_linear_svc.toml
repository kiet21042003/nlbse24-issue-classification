# P2 frozen configuration: TF-IDF word n-grams only with LinearSVC.
# This is the cost-selected operating point: on training-only 5-fold CV it scores
# within 0.001 macro-F1 of the word + character union while fitting about nine times
# faster and using a fifth of the memory. See reports/p2_feature_ablation.md.
model_family = "sparse"

[experiment]
seed = 42
n_splits = 5
text_fields = ["title", "body"]

[features.word]
enabled = true
analyzer = "word"
ngram_range = [1, 2]
min_df = 2
max_df = 1.0
max_features = 50000
sublinear_tf = true
strip_accents = "unicode"
lowercase = true

[features.char]
enabled = false
analyzer = "char_wb"
ngram_range = [2, 5]
min_df = 3
max_df = 1.0
max_features = 100000
sublinear_tf = true
strip_accents = "unicode"
lowercase = true

[classifier]
kind = "linear_svc"

[classifier.linear_svc]
C = 1.0
class_weight = "balanced"
max_iter = 5000
tol = 0.0001

[classifier.complement_nb]
alpha = 0.3
norm = false
