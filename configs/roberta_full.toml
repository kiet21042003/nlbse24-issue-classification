[experiment]
seed = 42
n_splits = 5
text_fields = ["title", "body"]

[model]
backbone = "roberta-base"
max_seq_length = 256
num_labels = 3

[adapter]
enabled = false

[training]
num_train_epochs = 5
per_device_train_batch_size = 16
per_device_eval_batch_size = 32
learning_rate = 2e-5
weight_decay = 0.01
