# P2 tuning sweep: fastText-style hashed linear model (pure scikit-learn).
# Training-only 5-fold CV, seed 42. 2 hash sizes x subword on/off = 4 points.
model_family = "fasttext_style"
run_prefix = "p2_fts"

[base.experiment]
seed = 42
n_splits = 5
text_fields = ["title", "body"]

[base.model]
n_features = 1048576
word_ngram_range = [1, 2]
char_ngram_range = [3, 5]
use_char_ngrams = true
alpha = 0.00001
max_iter = 30
tol = 0.0001
class_weight = "balanced"

[[axes]]
tag = "bits"
key = "model.n_features"
values = [262144, 1048576]

[[axes]]
tag = "sub"
key = "model.use_char_ngrams"
values = [true, false]
