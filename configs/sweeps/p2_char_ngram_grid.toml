# P2 refinement sweep: character n-gram range for the winning LinearSVC feature set.
# Run after p2_linear_svc_grid.toml; the base here already carries the winning C.
model_family = "sparse"
run_prefix = "p2_svc_ng"

[base.experiment]
seed = 42
n_splits = 5
text_fields = ["title", "body"]

[base.features.word]
enabled = true
analyzer = "word"
ngram_range = [1, 2]
min_df = 2
max_df = 1.0
max_features = 50000
sublinear_tf = true
strip_accents = "unicode"
lowercase = true

[base.features.char]
enabled = true
analyzer = "char_wb"
ngram_range = [2, 5]
min_df = 3
max_df = 1.0
max_features = 100000
sublinear_tf = true
strip_accents = "unicode"
lowercase = true

[base.classifier]
kind = "linear_svc"

[base.classifier.linear_svc]
C = 1.0
class_weight = "balanced"
max_iter = 5000
tol = 0.0001

[[axes]]
tag = "ng"
key = "features.char.ngram_range"
values = [[2, 4], [2, 5], [3, 5], [3, 6]]
